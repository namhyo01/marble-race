name: Build and Deploy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# peaceiris/actions-gh-pages가 gh-pages 브랜치로 push하려면 쓰기 권한이 필요하다.
# 저장소 기본값이 read-only인 경우가 있어 명시한다.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: build
        run: |
          npm ci
          npx update-browserslist-db@latest
          npm run build

      - name: deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
